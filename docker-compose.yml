# Finary MCP — standalone compose
# Designed for a Hostinger VPS using the Docker Manager template (n8n,
# WordPress, etc.). The Hostinger-managed Traefik discovers services via
# the Docker socket on containers joined to the external `traefik-proxy`
# network, and routes https://finary-mcp.${DOMAIN} to this container with
# a Let's Encrypt cert.
#
# Required .env vars: DOMAIN, FINARY_EMAIL, FINARY_PASSWORD, API_TOKEN

services:
  finary-mcp:
    image: python:3.12-slim
    container_name: finary-mcp
    restart: unless-stopped
    networks:
      - traefik-proxy
    expose:
      - "3002"
    volumes:
      - finary-session:/data
    environment:
      - PORT=3002
      - API_TOKEN=${API_TOKEN}
      - FINARY_EMAIL=${FINARY_EMAIL}
      - FINARY_PASSWORD=${FINARY_PASSWORD}
      - FINARY_SESSION_DIR=/data
    # Bootstrap: pip install deps, fetch the latest finary_mcp.py from
    # GitHub, exec it. `docker compose restart` = update to whatever's on main.
    command:
      - python
      - -c
      - |
        import urllib.request, subprocess, sys
        subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', 'mcp', 'finary_uapi', 'pydantic', 'uvicorn'], check=True)
        urllib.request.urlretrieve('https://raw.githubusercontent.com/seb7152/finary-mcp/main/finary_mcp.py', '/tmp/finary_mcp.py')
        exec(open('/tmp/finary_mcp.py').read())
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.finary-mcp.rule=Host(`finary-mcp.${DOMAIN}`)"
      - "traefik.http.routers.finary-mcp.entrypoints=websecure"
      - "traefik.http.routers.finary-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.finary-mcp.loadbalancer.server.port=3002"

networks:
  traefik-proxy:
    external: true

volumes:
  finary-session:
