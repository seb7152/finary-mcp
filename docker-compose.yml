# Finary MCP — standalone compose
# Designed to sit next to the Hostinger n8n template on the same VPS.
# That template deploys its own Traefik in a compose project named `root`
# (containers root-traefik-1, root-n8n-1) with cert resolver `mytlschallenge`.
# This stack joins the external `root_default` network so that Traefik
# discovers this container via the Docker socket and routes
# https://finary-mcp.${DOMAIN} to it with a Let's Encrypt cert.
#
# Required .env vars: DOMAIN, FINARY_EMAIL, FINARY_PASSWORD, API_TOKEN
# Optional OAuth 2.1 (Zitadel) vars: ZITADEL_ISSUER, OAUTH_REQUIRED_ROLE

services:
  finary-mcp:
    image: python:3.12-slim
    container_name: finary-mcp
    restart: unless-stopped
    networks:
      - root_default
    expose:
      - "3002"
    volumes:
      - finary-session:/data
    environment:
      - PORT=3002
      - API_TOKEN=${API_TOKEN}
      - FINARY_EMAIL=${FINARY_EMAIL}
      - FINARY_PASSWORD=${FINARY_PASSWORD}
      - FINARY_SESSION_DIR=/data
      - MCP_PUBLIC_URL=https://finary-mcp.${DOMAIN}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:-https://zitadel-k9z6.srv828065.hstgr.cloud}
      - OAUTH_REQUIRED_ROLE=${OAUTH_REQUIRED_ROLE:-finary:access}
    # Bootstrap: pip install deps, fetch the latest finary_mcp.py from
    # GitHub, exec it. `docker compose restart` = update to whatever's on main.
    # `mcp<2` is pinned: the MCP Python SDK's v2.0.0 removed
    # mcp.server.fastmcp as a breaking change, which crash-loops this server.
    command:
      - python
      - -c
      - |
        import urllib.request, subprocess, sys
        subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', 'mcp<2', 'httpx', 'finary_uapi', 'pydantic', 'uvicorn', 'yfinance'], check=True)
        urllib.request.urlretrieve('https://raw.githubusercontent.com/seb7152/finary-mcp/main/finary_mcp.py', '/tmp/finary_mcp.py')
        exec(open('/tmp/finary_mcp.py').read())
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.finary-mcp.rule=Host(`finary-mcp.${DOMAIN}`)"
      - "traefik.http.routers.finary-mcp.entrypoints=websecure"
      - "traefik.http.routers.finary-mcp.tls.certresolver=mytlschallenge"
      - "traefik.http.services.finary-mcp.loadbalancer.server.port=3002"

networks:
  root_default:
    external: true

volumes:
  finary-session:
